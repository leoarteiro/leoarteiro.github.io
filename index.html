<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogos de leoarteiro</title>
<link rel="icon" href="quizart/img/icone.png">
<style>
  :root { --bg: #FBF6EE; --card: #FFFCF7; --ink: #28201A; --muted: #6E6256; --accent: #8B4A2B; --line: #D8CBB8; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1C1814; --card: #28221C; --ink: #F1E9DD; --muted: #B9AC9C; --accent: #E6A07E; --line: #4E4439; }
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 Georgia, "Noto Serif", serif; }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px; }
  h1 { color: var(--accent); font-size: 30px; margin: 0 0 24px; }
  a.app { display: flex; gap: 16px; align-items: center; padding: 16px; border: 1px solid var(--line);
          border-radius: 16px; background: var(--card); color: var(--ink); text-decoration: none; }
  a.app img { width: 72px; height: 72px; border-radius: 16px; }
  a.app strong { color: var(--accent); font-size: 20px; }
  footer { margin-top: 32px; color: var(--muted); font-size: 15px; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Jogos de leoarteiro</h1>
  <a class="app" href="quizart/">
    <img src="quizart/img/icone.png" alt="">
    <span><strong>QuizArt: Quiz de Arte</strong><br>Responda perguntas sobre grandes obras de arte e monte cada uma, peça por peça.</span>
  </a>
  <footer>Contato: <a href="mailto:leoferreiraestudio@gmail.com">leoferreiraestudio@gmail.com</a></footer>
</main>
</body>
</html>
